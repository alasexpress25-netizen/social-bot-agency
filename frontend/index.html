<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel · Automatización de redes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1a1d23;
    --paper:#f7f6f3;
    --line:#e1ddd4;
    --accent:#3d5a4c;
    --accent-soft:#e8efe9;
    --warn:#a34e3a;
    --muted:#6b6a66;
    --radius:10px;
    font-family:'Iowan Old Style','Georgia',serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.5;
  }
  header{
    padding:28px 32px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header h1{
    font-family:'Iowan Old Style','Georgia',serif; font-size:22px; margin:0;
    letter-spacing:-0.01em;
  }
  header .tag{ color:var(--muted); font-size:13px; }
  main{ max-width:980px; margin:0 auto; padding:32px; }
  .auth-box{ max-width:360px; margin:80px auto; text-align:center; }
  .auth-box input{
    width:100%; padding:11px 12px; margin-bottom:10px; border:1px solid var(--line);
    border-radius:var(--radius); font-size:14px; background:#fff;
  }
  button{
    background:var(--accent); color:#fff; border:none; padding:10px 18px;
    border-radius:var(--radius); font-size:14px; cursor:pointer; font-weight:500;
  }
  button:hover{ opacity:0.92; }
  button.secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  section{ margin-bottom:36px; }
  section h2{ font-size:15px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:14px; font-weight:600; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:12px;
  }
  .card-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .client-name{ font-weight:600; font-size:16px; }
  .pill{
    display:inline-block; font-size:11px; padding:2px 9px; border-radius:99px;
    background:var(--accent-soft); color:var(--accent); margin-left:8px; font-weight:600;
  }
  .pill.off{ background:#f1ece5; color:var(--muted); }
  .meta-row{ color:var(--muted); font-size:13px; margin-top:6px; }
  form.inline{ display:grid; gap:10px; margin-top:14px; }
  form.inline input, form.inline select, form.inline textarea{
    padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; width:100%;
    font-family:inherit;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  details{ margin-top:10px; }
  summary{ cursor:pointer; color:var(--accent); font-size:13px; font-weight:600; }
  .status-published{ color:var(--accent); }
  .status-failed{ color:var(--warn); }
  .status-pending, .status-publishing{ color:var(--muted); }
  small.hint{ color:var(--muted); display:block; margin-top:4px; }
  .chart-wrap{ display:flex; align-items:flex-end; gap:6px; height:80px; padding:6px 0; }
  .chart-bar-col{ flex:1; text-align:center; }
  .chart-bar{ background:var(--accent); border-radius:3px 3px 0 0; margin:0 auto; width:70%; }
  .chart-label{ font-size:10px; color:var(--muted); margin-top:4px; }
  .metric-title{ font-size:12px; color:var(--muted); margin:10px 0 2px; }
  .card.pending{ border-color:#d8c7a8; background:#fdfaf3; }
  .btn-row{ display:flex; gap:8px; margin-top:10px; }
  button.reject{ background:var(--warn); }
</style>
</head>
<body>

<header>
  <h1>Panel de automatización</h1>
  <span class="tag" id="userTag"></span>
  <button onclick="logout()" style="margin-left:12px; padding:6px 14px; font-size:13px;">Cerrar sesión</button>
</header>

<main>
  <!-- LOGIN -->
  <div class="auth-box" id="authBox">
    <p style="color:var(--muted); margin-bottom:18px;">Iniciá sesión para gestionar tus clientes</p>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button onclick="login()" style="width:100%;">Entrar</button>
    <p style="margin-top:10px;"><a href="#" onclick="signup()" style="color:var(--accent); font-size:13px;">Crear cuenta nueva</a></p>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">

    <section>
      <h2>Nuevo cliente</h2>
      <div class="card">
        <form class="inline" onsubmit="createClient(event)">
          <input id="newClientName" placeholder="Nombre del cliente / negocio" required />
          <input id="newClientLink" placeholder="Link de venta (Hotmart, Gumroad, Payhip...)" />
          <button type="submit">Agregar cliente</button>
        </form>
      </div>
    </section>

    <section>
      <h2>Clientes</h2>
      <div id="clientsList"></div>
    </section>

  </div>
</main>

<script>
// ⚠️ Completá con los datos de tu proyecto Supabase (Settings > API)
const SUPABASE_URL = "https://redaqqxoeciycqgjhpbv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlZGFxcXhvZWNpeWNxZ2pocGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDcyMjEsImV4cCI6MjA5MzY4MzIyMX0.HqpOrWPtbYImgy57TafbaB4qriqmq4FI9GIa4Vg9FhI";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentAgencyId = null;

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alert(error.message); return; }
  boot();
}

async function signup(){
  const email = prompt("Email:");
  const password = prompt("Contraseña (mínimo 6 caracteres):");
  if(!email || !password) return;
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ alert(error.message); return; }
  alert("Cuenta creada. Si tu proyecto pide confirmación por email, revisá tu bandeja de entrada.");
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ return; }

  document.getElementById('authBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userTag').innerText = session.user.email;

  // Buscar o crear la agencia del usuario logueado
  let { data: agencies } = await sb.from('socialbot_agencies').select('*').eq('owner_user_id', session.user.id);
  if(!agencies || agencies.length === 0){
    const name = prompt("Nombre de tu agencia:") || "Mi Agencia";
    const { data: created } = await sb.from('socialbot_agencies').insert({ owner_user_id: session.user.id, name }).select();
    agencies = created;
  }
  currentAgencyId = agencies[0].id;
  loadClients();
}

async function createClient(e){
  e.preventDefault();
  const name = document.getElementById('newClientName').value;
  const sales_link = document.getElementById('newClientLink').value;
  await sb.from('socialbot_clients').insert({ agency_id: currentAgencyId, name, sales_link });
  document.getElementById('newClientName').value = '';
  document.getElementById('newClientLink').value = '';
  loadClients();
}

// ---------------------------------------------------------------------------
// FASE 4: Métricas — agrupa registros por semana (lunes a domingo, hora
// local del navegador) y los renderiza como barras simples con CSS puro,
// sin sumar ninguna libreria nueva. Mismo criterio que frontend/cliente.html.
// ---------------------------------------------------------------------------
function bucketByWeek(rows, dateField, weeks = 8, replyField = null){
  const now = new Date();
  const buckets = [];
  for(let i = weeks - 1; i >= 0; i--){
    const start = new Date(now);
    const dow = (start.getDay() + 6) % 7; // 0=lunes .. 6=domingo
    start.setHours(0,0,0,0);
    start.setDate(start.getDate() - dow - (i * 7));
    const end = new Date(start);
    end.setDate(start.getDate() + 7);
    buckets.push({ start, end, label: `${start.getDate()}/${start.getMonth()+1}`, count: 0, total: 0, replied: 0 });
  }
  (rows||[]).forEach(r => {
    if(!r[dateField]) return;
    const d = new Date(r[dateField]);
    const b = buckets.find(b => d >= b.start && d < b.end);
    if(!b) return;
    b.count++;
    if(replyField){ b.total++; if(r[replyField]) b.replied++; }
  });
  return buckets;
}

function renderBarChart(containerEl, buckets, { rate = false } = {}){
  const values = buckets.map(b => rate ? (b.total ? Math.round((b.replied / b.total) * 100) : 0) : b.count);
  const max = Math.max(1, ...values);
  containerEl.innerHTML = `
    <div class="chart-wrap">
      ${buckets.map((b, i) => {
        const value = values[i];
        const h = Math.max(3, (value / max) * 70);
        return `
          <div class="chart-bar-col">
            <div class="chart-bar" style="height:${h}px;" title="${b.label}: ${value}${rate ? '%' : ''}"></div>
            <div class="chart-label">${b.label}</div>
          </div>`;
      }).join('')}
    </div>`;
}

async function loadClients(){
  const { data: clients } = await sb.from('socialbot_clients').select('*').order('created_at', { ascending:false });
  const container = document.getElementById('clientsList');
  container.innerHTML = '';

  for(const c of (clients||[])){
    const { data: accounts } = await sb.from('socialbot_social_accounts').select('*').eq('client_id', c.id);
    const { data: aiRows } = await sb.from('socialbot_ai_settings').select('*').eq('client_id', c.id);
    const { data: slots } = await sb.from('socialbot_schedule_slots').select('*').eq('client_id', c.id).order('hour');
    const { data: media } = await sb.from('socialbot_media_assets').select('*').eq('client_id', c.id).order('created_at', {ascending:false});
    const { data: rules } = await sb.from('socialbot_auto_reply_rules').select('*').eq('client_id', c.id);
    const { data: posts } = await sb.from('socialbot_posts').select('*').eq('client_id', c.id).order('created_at', {ascending:false}).limit(5);
    const { data: leads } = await sb.from('socialbot_leads').select('*').eq('client_id', c.id).order('created_at', { ascending:false });
    const { data: pendingPosts } = await sb.from('socialbot_posts').select('*').eq('client_id', c.id).eq('approval_status', 'pending').order('created_at', { ascending:false });
    const { data: planItems } = await sb.from('socialbot_content_plan_items').select('*').eq('client_id', c.id).in('status', ['proposed','approved']).order('target_date', { ascending:true });

    const ai = (aiRows && aiRows[0]) || {};
    const leadsNuevos = (leads||[]).filter(l => l.status === 'nuevo').length;

    // Para los medios tipo 'carousel' no hay una unica url en el propio
    // media_asset; contamos cuantas imagenes tiene cada uno para mostrarlo
    // en el resumen (ver socialbot_carousel_items).
    const carouselMediaIds = (media||[]).filter(m => m.media_type === 'carousel').map(m => m.id);
    let carouselCounts = {};
    if(carouselMediaIds.length){
      const { data: items } = await sb.from('socialbot_carousel_items').select('media_asset_id').in('media_asset_id', carouselMediaIds);
      (items||[]).forEach(it => { carouselCounts[it.media_asset_id] = (carouselCounts[it.media_asset_id]||0) + 1; });
    }

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-row">
        <div>
          <span class="client-name">${c.name}</span>
          <span class="pill ${c.active ? '' : 'off'}">${c.active ? 'activo' : 'pausado'}</span>
        </div>
        <div>
          <button class="secondary" onclick="toggleActive('${c.id}', ${c.active})">${c.active ? 'Pausar' : 'Reactivar'}</button>
        </div>
      </div>
      <div class="meta-row">Link de venta: ${c.sales_link || '—'}</div>
      <div class="meta-row">Cuentas conectadas: ${(accounts||[]).map(a => `${a.platform} (${a.page_name||a.page_id})`).join(', ') || 'ninguna aún'}</div>
      <div class="meta-row">Acceso del cliente: ${c.client_email || 'sin asignar'} ${c.client_user_id ? '<span class="pill">ya entró</span>' : (c.client_email ? '<span class="pill off">pendiente</span>' : '')}</div>

      ${(pendingPosts||[]).length ? `
      <div style="margin-top:14px;">
        <div class="meta-row" style="margin-bottom:6px;">
          <strong>${pendingPosts.length} post(s) esperando aprobación</strong> — normalmente los aprueba el cliente desde su portal, pero también podés hacerlo vos acá (ej. si el cliente todavía no tiene acceso, o hay apuro).
        </div>
        ${pendingPosts.map(p => `
          <div class="card pending" style="margin-top:8px;">
            <textarea id="agency-caption-${p.id}" rows="3">${(p.caption||'').replace(/</g,'&lt;')}</textarea>
            <div class="btn-row">
              <button class="secondary" onclick="saveCaptionAsAgency('${p.id}')">Guardar texto</button>
              <button onclick="reviewPostAsAgency('${p.id}', 'approved')">Aprobar</button>
              <button class="reject" onclick="reviewPostAsAgency('${p.id}', 'rejected')">Rechazar</button>
            </div>
          </div>
        `).join('')}
      </div>
      ` : ''}

      ${(planItems||[]).length ? `
      <details open>
        <summary>📅 Plan semanal de contenido (IA) — ${planItems.length} idea(s)</summary>
        <div class="meta-row" style="margin-bottom:8px;">
          Generado automáticamente todos los lunes con base en métricas de posts, leads recientes y lo ya publicado. Editá el texto si hace falta y aprobá cada uno — el que quede aprobado se publica solo el día sugerido, con este texto tal cual (sin volver a pasar por la IA).
        </div>
        ${planItems.map(item => `
          <div class="card ${item.status === 'approved' ? '' : 'pending'}" style="margin-top:8px;">
            <div class="meta-row" style="margin-bottom:6px;">
              <strong>${new Date(item.target_date + 'T00:00:00').toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'short' })}</strong>
              ${item.angle ? ` · <span class="pill">${item.angle}</span>` : ''}
              ${item.status === 'approved' ? ' · <span class="pill">aprobado, se publica solo</span>' : ''}
            </div>
            ${item.based_on ? `<div class="meta-row" style="font-style:italic; margin-bottom:8px;">${item.based_on}</div>` : ''}
            <textarea id="plan-caption-${item.id}" rows="4" ${item.status === 'approved' ? 'disabled' : ''}>${(item.caption||'').replace(/</g,'&lt;')}</textarea>
            <div class="btn-row">
              ${item.status === 'approved' ? `
                <button class="secondary" onclick="reviewContentPlanItem('${item.id}', 'proposed')">Volver a editar</button>
                <button class="reject" onclick="reviewContentPlanItem('${item.id}', 'rejected')">Rechazar</button>
              ` : `
                <button class="secondary" onclick="saveContentPlanCaption('${item.id}')">Guardar texto</button>
                <button onclick="reviewContentPlanItem('${item.id}', 'approved')">Aprobar</button>
                <button class="reject" onclick="reviewContentPlanItem('${item.id}', 'rejected')">Rechazar</button>
              `}
            </div>
          </div>
        `).join('')}
      </details>
      ` : ''}

      <form class="inline" onsubmit="saveClientPortalAccess(event, '${c.id}')" style="margin-top:8px; max-width:340px;">
        <input name="client_email" placeholder="Email del cliente (portal)" value="${c.client_email || ''}" />
        <label style="font-size:13px; color:var(--muted);">
          <input type="checkbox" name="require_approval" ${c.require_approval ? 'checked' : ''} style="width:auto; vertical-align:middle;" />
          El cliente debe aprobar cada post antes de publicarse
        </label>
        <button type="submit" class="secondary">Guardar acceso</button>
      </form>

      <details>
        <summary>Conectar cuenta de Facebook / Instagram</summary>
        <form class="inline" onsubmit="addAccount(event, '${c.id}')">
          <small class="hint">Generá el Page Access Token de larga duración en Graph API Explorer (ver README) y pegalo acá.</small>
          <div class="grid2">
            <select name="platform" required>
              <option value="facebook">Facebook</option>
              <option value="instagram">Instagram</option>
            </select>
            <input name="page_name" placeholder="Nombre de la página" />
          </div>
          <input name="page_id" placeholder="Page ID" required />
          <input name="ig_business_id" placeholder="Instagram Business ID (solo si es Instagram)" />
          <input name="page_access_token" placeholder="Page Access Token" required />
          <button type="submit">Guardar cuenta</button>
        </form>
      </details>

      <details>
        <summary>Configurar IA (${ai.provider || 'sin configurar'})</summary>
        <form class="inline" onsubmit="saveAi(event, '${c.id}')">
          <div class="grid2">
            <select name="provider">
              <option value="groq" ${ai.provider==='groq'?'selected':''}>Groq (gratis)</option>
              <option value="openai" ${ai.provider==='openai'?'selected':''}>OpenAI</option>
              <option value="claude" ${ai.provider==='claude'?'selected':''}>Claude</option>
            </select>
            <input name="tone" placeholder="Tono (ej: cercano y profesional)" value="${ai.tone||''}" />
          </div>
          <label style="font-size:13px; color:var(--muted);">Modelo para el plan semanal de contenido (Fase 6) — independiente del de arriba, para no compartir cuota gratuita con las respuestas automáticas</label>
          <select name="content_plan_provider">
            <option value="groq" ${ai.content_plan_provider==='groq'?'selected':''}>Groq (gratis)</option>
            <option value="openai" ${ai.content_plan_provider==='openai'?'selected':''}>OpenAI</option>
            <option value="claude" ${ai.content_plan_provider==='claude'?'selected':''}>Claude</option>
          </select>
          <textarea name="topics" placeholder="Temas/keywords del negocio">${ai.topics||''}</textarea>
          <label style="font-size:13px; color:var(--muted);">Base de conocimiento (servicios, precios reales, FAQ, políticas — la IA la usa como fuente de verdad, no inventa datos)</label>
          <textarea name="knowledge_base" rows="6" placeholder="Ej: Ofrecemos gestión de redes desde $200/mes. Horario de atención: L-V 9-18hs. No hacemos devoluciones después de 7 días. Envíos a todo el país...">${ai.knowledge_base||''}</textarea>
          <textarea name="system_prompt" placeholder="Instrucciones para la IA">${ai.system_prompt||''}</textarea>
          <button type="submit">Guardar configuración</button>
        </form>
      </details>

      <details>
        <summary>Horarios de publicación (${(slots||[]).length})</summary>
        <div>${(slots||[]).map(s => `${s.day_of_week ? ['','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][s.day_of_week]+' ' : 'Todos los días '}${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')}${s.active ? '' : ' (inactivo)'}`).join(' · ') || 'sin horarios'}</div>
        <form class="inline" onsubmit="addSlot(event, '${c.id}')">
          <div class="grid2">
            <input name="hour" type="number" min="0" max="23" placeholder="Hora (0-23)" required />
            <input name="minute" type="number" min="0" max="59" placeholder="Minuto" value="0" />
          </div>
          <select name="day_of_week">
            <option value="">Todos los días</option>
            <option value="1">Lunes</option>
            <option value="2">Martes</option>
            <option value="3">Miércoles</option>
            <option value="4">Jueves</option>
            <option value="5">Viernes</option>
            <option value="6">Sábado</option>
            <option value="7">Domingo</option>
          </select>
          <button type="submit">Agregar horario</button>
        </form>
      </details>

      <details>
        <summary>Medios para publicar (${(media||[]).length})</summary>
        <div>${(media||[]).map(m => `${m.media_type}${m.media_type==='carousel' ? ` (${carouselCounts[m.id]||0} imágenes)` : ''} · usado ${m.times_used}x${m.caption_override ? ' · caption fijo' : ' · caption con IA'}`).join('<br>') || 'sin medios cargados'}</div>
        <form class="inline" onsubmit="addMedia(event, '${c.id}')">
          <select name="media_type" onchange="toggleMediaTypeFields(this)">
            <option value="video">Video / Reel</option>
            <option value="image">Imagen</option>
            <option value="carousel">Carrusel (varias imágenes)</option>
          </select>
          <input name="url" placeholder="URL pública del video/imagen (https://...)" />
          <textarea name="carousel_urls" placeholder="Solo para carrusel: una URL de imagen por línea (entre 2 y 10)" style="display:none;"></textarea>
          <input name="fb_photo_url" placeholder="URL de foto para Facebook (opcional, solo si el medio de arriba es un video). Si la cargás, en Facebook se publica esta foto en vez del video." />
          <textarea name="caption_override" placeholder="Caption fijo (opcional). Si lo dejás vacío, el bot genera uno con IA cada vez. Incluí acá los hashtags si querés."></textarea>
          <button type="submit">Agregar medio</button>
        </form>
      </details>

      <details>
        <summary>Reglas de auto-respuesta (${(rules||[]).length})</summary>
        ${(rules||[]).map(r => `
          <form class="inline" onsubmit="updateRule(event, '${r.id}', '${c.id}')" style="border-top:1px solid var(--line); padding-top:10px; margin-top:10px;">
            <div class="grid2">
              <input name="keyword" value="${(r.keyword||'').replace(/"/g,'&quot;')}" placeholder="Palabra clave" required />
              <select name="match_type">
                <option value="both" ${r.match_type==='both'?'selected':''}>Comentarios + DMs</option>
                <option value="comment" ${r.match_type==='comment'?'selected':''}>Solo comentarios</option>
                <option value="dm" ${r.match_type==='dm'?'selected':''}>Solo DMs</option>
              </select>
            </div>
            <textarea name="reply_template" placeholder="Respuesta. Usá {{sales_link}} para el link" required>${r.reply_template||''}</textarea>
            <div class="grid2">
              <button type="submit">Guardar cambios</button>
              <button type="button" class="secondary" onclick="deleteRule('${r.id}', '${c.id}')">Eliminar</button>
            </div>
          </form>
        `).join('') || '<div>sin reglas</div>'}
        <form class="inline" onsubmit="addRule(event, '${c.id}')" style="border-top:1px solid var(--line); padding-top:10px; margin-top:10px;">
          <input name="keyword" placeholder="Palabra clave (ej: precio, quiero, info)" required />
          <select name="match_type">
            <option value="both">Comentarios + DMs</option>
            <option value="comment">Solo comentarios</option>
            <option value="dm">Solo DMs</option>
          </select>
          <textarea name="reply_template" placeholder="Respuesta. Usá {{sales_link}} para el link" required></textarea>
          <button type="submit">Agregar regla</button>
        </form>
      </details>

      <details>
        <summary>Últimas publicaciones</summary>
        <div>${(posts||[]).map(p => `<div class="status-${p.status}">[${p.status}] ${(p.caption||'').slice(0,80)}...</div>`).join('') || 'todavía no hay publicaciones'}</div>
      </details>

      <details>
        <summary>Métricas (últimas 8 semanas)</summary>
        <div class="metric-title">Leads por semana</div>
        <div id="chartLeads-${c.id}"></div>
        <div class="metric-title">Posts publicados por semana</div>
        <div id="chartPosts-${c.id}"></div>
        <div class="metric-title">Tasa de respuesta automática (%)</div>
        <div id="chartReplyRate-${c.id}"></div>
      </details>

      <details>
        <summary>Leads capturados (${(leads||[]).length}${leadsNuevos ? ` · ${leadsNuevos} sin contactar` : ''})</summary>
        ${(leads||[]).map(l => `
          <div class="card" style="margin-top:8px; padding:12px 14px;">
            <div class="card-row">
              <div>
                <strong>${l.name || 'Sin nombre'}</strong>
                <div class="meta-row" style="margin-top:2px;">${l.platform} · ${l.contact || 'sin contacto'}</div>
              </div>
              <select onchange="updateLeadStatus('${l.id}', this.value)">
                <option value="nuevo" ${l.status==='nuevo'?'selected':''}>Nuevo</option>
                <option value="contactado" ${l.status==='contactado'?'selected':''}>Contactado</option>
                <option value="convertido" ${l.status==='convertido'?'selected':''}>Convertido</option>
                <option value="descartado" ${l.status==='descartado'?'selected':''}>Descartado</option>
              </select>
            </div>
            <div class="meta-row">Interés: ${l.interest || '—'}</div>
            <div class="meta-row" style="font-style:italic;">"${(l.source_text||'').replace(/"/g,'&quot;').slice(0,140)}"</div>
          </div>
        `).join('') || '<div class="meta-row">sin leads todavía</div>'}
      </details>
    `;
    container.appendChild(div);

    // Metricas: se cargan aparte porque necesitan una tabla mas
    // (interactions_log) que no se pidio arriba junto con el resto.
    const { data: interactions } = await sb.from('socialbot_interactions_log')
      .select('created_at, replied').eq('client_id', c.id);
    const publishedPosts = (posts||[]).filter(p => p.status === 'published');
    // posts de arriba viene limitado a 5 (para el listado); para el grafico
    // de 8 semanas conviene traer el historial completo del cliente.
    const { data: allPosts } = await sb.from('socialbot_posts')
      .select('published_at').eq('client_id', c.id).eq('status', 'published');

    renderBarChart(document.getElementById(`chartLeads-${c.id}`), bucketByWeek(leads, 'created_at'));
    renderBarChart(document.getElementById(`chartPosts-${c.id}`), bucketByWeek(allPosts, 'published_at'));
    renderBarChart(document.getElementById(`chartReplyRate-${c.id}`), bucketByWeek(interactions, 'created_at', 8, 'replied'), { rate: true });
  }
}

async function addSlot(e, clientId){

  await sb.from('socialbot_schedule_slots').insert({

function toggleMediaTypeFields(selectEl){
  const form = selectEl.closest('form');
  const isCarousel = selectEl.value === 'carousel';
  form.querySelector('[name="url"]').style.display = isCarousel ? 'none' : 'block';
  form.querySelector('[name="carousel_urls"]').style.display = isCarousel ? 'block' : 'none';
  form.querySelector('[name="fb_photo_url"]').style.display = isCarousel ? 'none' : 'block';
}

async function addMedia(e, clientId){
  e.preventDefault();
  const f = new FormData(e.target);
  const mediaType = f.get('media_type');

  if(mediaType === 'carousel'){
    const urls = (f.get('carousel_urls') || '').split('\n').map(u => u.trim()).filter(Boolean);
    if(urls.length < 2 || urls.length > 10){
      alert('Un carrusel necesita entre 2 y 10 imágenes (una URL por línea).');
      return;
    }
    const { data: createdAsset, error } = await sb.from('socialbot_media_assets').insert({
      client_id: clientId,
      url: null,
      media_type: 'carousel',
      caption_override: f.get('caption_override') || null,
    }).select();
    if(error){ alert(error.message); return; }
    const assetId = createdAsset[0].id;
    const itemRows = urls.map((url, i) => ({ media_asset_id: assetId, url, position: i }));
    await sb.from('socialbot_carousel_items').insert(itemRows);
  } else {
    const url = f.get('url');
    if(!url){ alert('Cargá la URL del medio.'); return; }
    await sb.from('socialbot_media_assets').insert({
      client_id: clientId,
      url,
      media_type: mediaType,
      caption_override: f.get('caption_override') || null,
      fb_photo_url: f.get('fb_photo_url') || null,
    });
  }
  loadClients();
}

async function addRule(e, clientId){
  e.preventDefault();
  const f = new FormData(e.target);
  await sb.from('socialbot_auto_reply_rules').insert({
    client_id: clientId,
    keyword: f.get('keyword'),
    match_type: f.get('match_type'),

async function updateRule(e, ruleId, clientId){

  const f = new FormData(e.target);

    keyword: f.get('keyword'),
    match_type: f.get('match_type'),
    reply_template: f.get('reply_template'),
  }).eq('id', ruleId);

}

async function deleteRule(ruleId, clientId){
  if(!confirm('¿Eliminar esta regla?')) return;
  await sb.from('socialbot_auto_reply_rules').delete().eq('id', ruleId);
  loadClients();
}

async function updateLeadStatus(leadId, status){
  await sb.from('socialbot_leads').update({ status, updated_at: new Date().toISOString() }).eq('id', leadId);
  loadClients();
}

// ---------------------------------------------------------------------------
// FASE 5: la agencia tambien puede aprobar/rechazar (y editar el texto de)
// un post pendiente, ademas del cliente desde su propio portal. No hace
// falta ninguna funcion RPC especial para esto (a diferencia del cliente):
// la agencia ya tiene UPDATE directo sobre estas filas via la policy
// "owner sees own posts" (0001_init.sql, "for all"). El scheduler publica
// lo aprobado en la siguiente corrida sin importar quien lo aprobo.
// ---------------------------------------------------------------------------
async function reviewPostAsAgency(postId, decision){
  const { error } = await sb.from('socialbot_posts').update({ approval_status: decision }).eq('id', postId);
  if(error){ alert(error.message); return; }
  loadClients();
}

async function saveCaptionAsAgency(postId){
  const value = document.getElementById(`agency-caption-${postId}`).value;
  const { error } = await sb.from('socialbot_posts').update({ caption: value }).eq('id', postId);
  if(error){ alert(error.message); return; }
  alert('Texto guardado.');
}

// ---------------------------------------------------------------------------

  const { error } = await sb.from('socialbot_content_plan_items').update(patch).eq('id', itemId);
  if(error){ alert(error.message); return; }
  loadClients();
}
