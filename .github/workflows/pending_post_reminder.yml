name: Recordatorio de posts pendientes de aprobación

# NOTA: la Edge Function remind-pending-post (propuesta 12 de
# PROPUESTAS-AGENCIA.md) ya esta deployada y activa en produccion, pero este
# workflow todavia no existe en el repo de GitHub -- se agrega aca siguiendo
# el mismo patron que stale-leads-check.yml. Antes de darlo por bueno,
# fijate si ya tenés algo similar corriendo (por si lo armaste manual desde
# GitHub) para no duplicar el cron.

on:
  schedule:
    # Dos veces al día, 09:00 y 21:00 America/Sao_Paulo (UTC-3) = 12:00 y 00:00 UTC.
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # permite dispararlo manualmente desde GitHub para probar

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar remind-pending-post
        run: |
          curl -sS -X POST "https://redaqqxoeciycqgjhpbv.supabase.co/functions/v1/remind-pending-post" \
            -H "Content-Type: application/json"
