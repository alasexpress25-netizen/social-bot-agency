name: Publicar en redes (1x al dia)

on:
  schedule:
    # Corre cada 15 minutos, todo el dia. El propio script decide si hay que
    # publicar o no, comparando la hora local de CADA cliente (segun su
    # timezone en Supabase) contra sus horarios en `socialbot_schedule_slots`
    # (que ahora soportan un horario distinto por dia de la semana).
    # Cambiar los horarios ya NO requiere tocar este archivo: se edita
    # directo en la tabla `socialbot_schedule_slots` desde Supabase.
    - cron: "*/15 * * * *"
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub para probar,
                        # o desde el boton "Publicar ahora" del panel via la API
    inputs:
      client_id:
        description: 'Client ID a publicar ahora (vacio = todos los horarios que matcheen)'
        required: false
        default: ''
      media_id:
        description: 'Media Asset ID puntual a publicar ahora (vacio = rotacion normal). Requiere client_id.'
        required: false
        default: ''

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scheduler/requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ejecutar scheduler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MANUAL_CLIENT_ID: ${{ github.event.inputs.client_id }}
          MANUAL_MEDIA_ID: ${{ github.event.inputs.media_id }}
        run: python scheduler/post_scheduler.py
