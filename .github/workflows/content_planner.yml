name: Generar plan semanal de contenido (IA)

on:
  schedule:
    # Lunes 09:00 America/Sao_Paulo (UTC-3) = 12:00 UTC. Ajustar si la
    # mayoria de los clientes esta en otro huso horario predominante.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}   # permite dispararlo manualmente desde GitHub para probar o forzar una semana

jobs:
  planificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scheduler/requirements.txt

      - name: Generar plan de contenido
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Keys SEPARADAS para este cron (pedido 15/07/2026, ver
          # README_ai_quota_separation_request.txt): asi el plan semanal no
          # compite por la misma cuota gratuita que el webhook de
          # comentarios/DMs ni el caption generado al publicar. Son
          # opcionales -- content_planner.py cae de vuelta a la key
          # compartida de arriba si estos secrets no estan cargados en el
          # repo (Settings > Secrets and variables > Actions).
          GROQ_API_KEY_CONTENT_PLAN: ${{ secrets.GROQ_API_KEY_CONTENT_PLAN }}
          OPENAI_API_KEY_CONTENT_PLAN: ${{ secrets.OPENAI_API_KEY_CONTENT_PLAN }}
          CLAUDE_API_KEY_CONTENT_PLAN: ${{ secrets.CLAUDE_API_KEY_CONTENT_PLAN }}
          # Fallback si Groq falla o queda deprecado (pedido 24/08/2026):
          # content_planner.py ya prueba Gemini automaticamente despues de
          # Groq, pero necesita esta key para poder hacerlo. Se puede usar
          # una key separada (GEMINI_API_KEY_CONTENT_PLAN) o compartir la
          # general (GEMINI_API_KEY), igual que ya hace con las demas IA.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_CONTENT_PLAN: ${{ secrets.GEMINI_API_KEY_CONTENT_PLAN }}
        run: python scheduler/content_planner.py
