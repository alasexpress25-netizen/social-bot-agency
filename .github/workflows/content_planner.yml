name: Generar plan semanal de contenido (IA)

on:
  schedule:
    # Lunes 09:00 America/Sao_Paulo (UTC-3) = 12:00 UTC. Ajustar si la
    # mayoria de los clientes esta en otro huso horario predominante.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}   # permite dispararlo manualmente desde GitHub para probar o forzar una semana

jobs:
  planificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scheduler/requirements.txt

      - name: Generar plan de contenido
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scheduler/content_planner.py
